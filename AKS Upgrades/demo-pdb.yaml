apiVersion: v1
kind: Namespace
metadata:
  name: demo-upgrade
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: demo-upgrade
  labels:
    app: web-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      nodeSelector:
        workload: demo
      containers:
      - name: nginx
        image: mcr.microsoft.com/azurelinux/base/nginx:1.28
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-demo-pdb
  namespace: demo-upgrade
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web-demo
